// Razdor built-in demo spells: our own content, in the spell ini schema the engine reads
// from a Discord Times install (keys: docs/reference/mechanics.md 3.2). The id of a spell is
// its position in this file (1-based).
//   Type=      Life / Elemental / Death
//   TimeCast=  hours of game time to cast; TimeWork= hours it lasts (empty: instant)
//   Target=    Hero (your own army) or Enemy (an army near you)
//   DeltaFixedHits= instant healing (+) or wounds (-) on every unit
//   d-Stat= / p-Stat= flat / percent change while it lasts

