// Razdor built-in demo units: our own content, written in the same ini schema the engine
// reads from a Discord Times install (keys: docs/reference/mechanics.md 1.1).
// Extra keys used only by the demo:
//   Key=      file stem for sprite overrides and a stable name for the demo world
//   StartGold= gold the hero class starts with
//   StartSpells= spells (ids of data/spells.ini) in the hero's book at the start
// Ids 1-3 are the hero classes, in the same order as the original (knight, mage, ranger).

