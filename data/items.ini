// Razdor built-in demo items: our own content, in the artefact ini schema the engine reads
// from a Discord Times install (keys: docs/reference/mechanics.md 4).
//   Type=   BlowWeapon (warriors) ShotWeapon (shooters) Staff (mages) Armor Helm Shield
//           Ring Amulet Potion Item (trade goods, cannot be worn)
//   d-Stat= flat change, p-Stat= percent change, f-Stat= fixed value (on potions f-Hits heals)
//   Bonus=  a unit bonus granted while worn
// Extra key used only by the demo:
//   Sources= where the item turns up: market loot tribute
//   Key=     file stem for sprite overrides
//   NameRu=  the name in the Russian interface

