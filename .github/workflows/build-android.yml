name: Build Android Clean APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Compatible NDK (r25b) and SDK Platform 29
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-29" "ndk;25.2.9519653"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk

      - name: Vendor and sanitize all dependencies
        run: |
          # 1. Скачиваем все зависимости локально в папку vendor
          mkdir -p .cargo
          cargo vendor > .cargo/config.toml

          # 2. Понижаем версию формата lock-файла до 3
          sed -i 's/version = 4/version = 3/' Cargo.lock || true

          # 3. Заменяем edition = "2024" во всех вендорных библиотеках на "2021"
          find vendor/ -name "Cargo.toml" -exec sed -i 's/edition = "2024"/edition = "2021"/g' {} +

      - name: Ensure assets directory exists
        run: mkdir -p assets

      - name: Build Android APK (arm64-v8a)
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          # Настраиваем пути к совместимому NDK 25.2
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          export ANDROID_NDK_ROOT="$NDK_PATH"
          export NDK_HOME="$NDK_PATH"
          export PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          # Создаем симлинк на случай проверки устаревшего имени утилиты ar
          cd "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -sf llvm-ar arm-linux-androideabi-ar || true

          cd "$GITHUB_WORKSPACE"
          cargo quad-apk build --release --offline

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: razdor-engine-apk
          path: target/**/*.apk
