name: Build Android Clean APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add Android target explicitly
        run: rustup target add aarch64-linux-android

      - name: Install Android SDK Platform 29
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-29"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk

      - name: Ensure assets directory exists
        run: mkdir -p assets

      - name: Build Android APK (arm64-v8a)
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          export NDK_HOME=$ANDROID_NDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cargo quad-apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: razdor-engine-apk
          path: target/**/*.apk
