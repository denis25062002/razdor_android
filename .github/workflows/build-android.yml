name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Install Android SDK and NDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-29" "ndk;25.2.9519653"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk

      - name: Pin encoding_rs and fix Cargo.lock format
        run: |
          cargo add encoding_rs@=0.8.33
          sed -i 's/^version = 4/version = 3/' Cargo.lock

      - name: Ensure assets directory exists
        run: mkdir -p assets

      - name: Configure NDK
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

          # Вспомогательные симлинки
          ln -sf "$TOOLCHAIN/llvm-ar" "$TOOLCHAIN/aarch64-linux-android-ar"
          ln -sf "$TOOLCHAIN/llvm-ranlib" "$TOOLCHAIN/aarch64-linux-android-ranlib"
          ln -sf "$TOOLCHAIN/llvm-strip" "$TOOLCHAIN/aarch64-linux-android-strip"
          ln -sf "$TOOLCHAIN/aarch64-linux-android29-clang" "$TOOLCHAIN/aarch64-linux-android-clang"
          ln -sf "$TOOLCHAIN/aarch64-linux-android29-clang" "$TOOLCHAIN/aarch64-linux-android-gcc"
          
          ln -sf "$TOOLCHAIN/llvm-ar" "$TOOLCHAIN/arm-linux-androideabi-ar"
          ln -sf "$TOOLCHAIN/llvm-ranlib" "$TOOLCHAIN/arm-linux-androideabi-ranlib"
          ln -sf "$TOOLCHAIN/llvm-strip" "$TOOLCHAIN/arm-linux-androideabi-strip"
          ln -sf "$TOOLCHAIN/armv7a-linux-androideabi29-clang" "$TOOLCHAIN/arm-linux-androideabi-clang"
          ln -sf "$TOOLCHAIN/armv7a-linux-androideabi29-clang" "$TOOLCHAIN/arm-linux-androideabi-gcc"

          # Обертка линковщика для aarch64
          cat << 'EOF' > "$TOOLCHAIN/aarch64-linux-android-ld"
#!/usr/bin/env bash
TOOLCHAIN_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
CLANG_DIR="$(ls -d "$TOOLCHAIN_DIR"/../lib*/clang/*/lib/linux/aarch64 2>/dev/null | head -n 1)"

ARGS=()
for arg in "$@"; do
  if [[ "$arg" == -Wl,* ]]; then
    cleaned="${arg#-Wl,}"
    IFS=',' read -ra PARTS <<< "$cleaned"
    for part in "${PARTS[@]}"; do
      ARGS+=("$part")
    done
  else
    ARGS+=("$arg")
  fi
done

exec "$TOOLCHAIN_DIR/ld.lld" -L"$CLANG_DIR" "${ARGS[@]}"
EOF
          chmod +x "$TOOLCHAIN/aarch64-linux-android-ld"

          # Обертка линковщика для armv7
          cat << 'EOF' > "$TOOLCHAIN/arm-linux-androideabi-ld"
#!/usr/bin/env bash
TOOLCHAIN_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
CLANG_DIR="$(ls -d "$TOOLCHAIN_DIR"/../lib*/clang/*/lib/linux/arm 2>/dev/null | head -n 1)"

ARGS=()
for arg in "$@"; do
  if [[ "$arg" == -Wl,* ]]; then
    cleaned="${arg#-Wl,}"
    IFS=',' read -ra PARTS <<< "$cleaned"
    for part in "${PARTS[@]}"; do
      ARGS+=("$part")
    done
  else
    ARGS+=("$arg")
  fi
done

exec "$TOOLCHAIN_DIR/ld.lld" -L"$CLANG_DIR" "${ARGS[@]}"
EOF
          chmod +x "$TOOLCHAIN/arm-linux-androideabi-ld"

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android-ld" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/arm-linux-androideabi-ld" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          RUSTFLAGS: "-C link-arg=-z -C link-arg=max-page-size=16384"
        run: cargo quad-apk build --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: razdor-engine-apk
          path: target/**/*.apk
