name: Build Android arm64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add Android target explicitly
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build for Android (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a -o ./build_output build --release

      - name: Upload Android Binary
        uses: actions/upload-artifact@v4
        with:
          name: razdor-android-arm64
          path: |
            build_output/
            target/aarch64-linux-android/release/razdor
